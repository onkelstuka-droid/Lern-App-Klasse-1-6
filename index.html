<!doctype html><html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lern-App Klasse 1–6</title>
<meta name="description" content="Buchstaben, Zahlen, Rechnen, Schreiben und Sprechen lernen – für Kinder der Klassen 1 bis 6.">
<meta name="theme-color" content="#3a9cff">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lern-App">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Fredoka:wght@400;500;600;700&display=swap">
<style>
:root {
  --bg: #e6f5ff; --bg2: #fff7e8; --ink: #23324a; --muted: #6a7a91; --card: #ffffff; --line: #d8e6f3;
  --ok: #22b46b; --okbg: #dcf8e8; --bad: #f2554f; --badbg: #ffe3e1;
  --coral: #ff7a6b; --sun: #ffbf1f; --mint: #1fbf9f; --lav: #9a78ff; --sky: #3a9cff; --org: #ff9532; --pink: #ff64ab; --grn: #5ec94d;
  --r: 22px; --sh: 0 5px 0 rgba(35, 50, 74, .12);
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; min-height: 100%; }
body {
  font-family: "Fredoka", system-ui, sans-serif; color: var(--ink); font-size: 18px; line-height: 1.35;
  background: var(--bg);
  background-image: radial-gradient(circle at 78% 150px, rgba(255,255,255,.8) 0 38px, transparent 39px), radial-gradient(circle at 88% 140px, rgba(255,255,255,.8) 0 48px, transparent 49px), linear-gradient(#cdeeff, var(--bg) 280px);
  background-repeat: no-repeat; overscroll-behavior-y: contain;
}
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; touch-action: manipulation; }
input, select { font: inherit; color: inherit; }
[hidden] { display: none !important; }
.wrap { max-width: 640px; margin: 0 auto; padding: 14px 16px 90px; }
h1, h2, h3 { margin: 0; font-weight: 600; line-height: 1.15; }
h1 { font-size: 30px; } h2 { font-size: 24px; } h3 { font-size: 19px; }
.muted { color: var(--muted); font-size: 15px; }
.row { display: flex; align-items: center; gap: 10px; }
.sp { flex: 1; }
.card { background: var(--card); border-radius: var(--r); box-shadow: var(--sh); padding: 16px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 54px; padding: 0 22px; border-radius: 18px; font-weight: 600; font-size: 20px;
  background: var(--sky); color: #fff; box-shadow: 0 5px 0 #1c6fc7; transition: transform .08s; }
.btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #1c6fc7; }
.btn.green { background: var(--ok); box-shadow: 0 5px 0 #168650; }
.btn.orange { background: var(--org); box-shadow: 0 5px 0 #c96a10; }
.btn.ghost { background: #fff; color: var(--ink); box-shadow: 0 5px 0 var(--line); border: 2px solid var(--line); }
.btn.small { min-height: 42px; font-size: 16px; padding: 0 14px; border-radius: 14px; }
.btn.wide { width: 100%; }
.btn[disabled] { opacity: .45; }
.icon-btn { width: 46px; height: 46px; border-radius: 15px; background: #fff; box-shadow: 0 4px 0 var(--line); font-size: 22px; display: grid; place-items: center; flex: none; }
.icon-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }

/* ---------- Kopf ---------- */
.top { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.ava { width: 58px; height: 58px; border-radius: 20px; background: #fff; box-shadow: var(--sh); display: grid; place-items: center; font-size: 36px; flex: none; }
.hello b { font-size: 24px; display: block; font-weight: 600; }
.pill { display: inline-flex; align-items: center; gap: 5px; background: #fff; border-radius: 99px; padding: 4px 12px; font-size: 15px; font-weight: 500; box-shadow: 0 3px 0 var(--line); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }
.stat { background: #fff; border-radius: 18px; box-shadow: var(--sh); padding: 10px 8px; text-align: center; }
.stat b { display: block; font-size: 24px; font-weight: 600; }
.stat span { font-size: 13px; color: var(--muted); }
.goal { height: 12px; border-radius: 99px; background: #eef3f8; overflow: hidden; margin-top: 6px; }
.goal i { display: block; height: 100%; background: linear-gradient(90deg, var(--sun), var(--org)); border-radius: 99px; }

.mascot { display: flex; gap: 10px; align-items: flex-start; margin: 4px 0 16px; }
.mascot .owl { font-size: 46px; line-height: 1; flex: none; animation: bob 2.4s ease-in-out infinite; }
.bubble { background: #fff; border-radius: 18px; padding: 10px 14px; box-shadow: var(--sh); position: relative; font-size: 17px; }
.bubble:before { content: ""; position: absolute; left: -8px; top: 16px; border: 8px solid transparent; border-right-color: #fff; border-left: 0; }
@keyframes bob { 50% { transform: translateY(-5px) rotate(-4deg); } }

.today { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; background: linear-gradient(120deg, #ffd34d, #ff9f43); color: #4a2a00;
  border-radius: var(--r); padding: 14px 16px; box-shadow: 0 6px 0 #d97a1b; margin-bottom: 18px; }
.today .ic { font-size: 44px; }
.today b { font-size: 21px; display: block; font-weight: 600; }
.today:active { transform: translateY(4px); box-shadow: 0 2px 0 #d97a1b; }

.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.tile { --c: var(--sky); position: relative; text-align: left; background: var(--c); color: #fff; border-radius: 24px; padding: 14px; min-height: 128px;
  display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 6px 0 color-mix(in srgb, var(--c) 68%, #000); overflow: hidden; }
.tile:active { transform: translateY(4px); box-shadow: 0 2px 0 color-mix(in srgb, var(--c) 68%, #000); }
.tile .ic { font-size: 42px; line-height: 1; filter: drop-shadow(0 2px 0 rgba(0, 0, 0, .12)); }
.tile b { font-size: 20px; font-weight: 600; text-shadow: 0 1px 0 rgba(0, 0, 0, .15); }
.tile small { font-size: 14px; opacity: .95; display: block; }
.tile .badge { position: absolute; top: 10px; right: 10px; background: #fff; color: var(--bad); font-weight: 700; border-radius: 99px; min-width: 28px; height: 28px; display: grid; place-items: center; font-size: 15px; padding: 0 6px; }
.tile.faded { opacity: .55; }
.c-coral { --c: var(--coral); } .c-sun { --c: var(--sun); } .c-mint { --c: var(--mint); } .c-lav { --c: var(--lav); } .c-sky { --c: var(--sky); } .c-org { --c: var(--org); } .c-pink { --c: var(--pink); } .c-grn { --c: var(--grn); }
.c-sun b, .c-sun small { color: #5a3d00; text-shadow: none; }
.sec { margin: 22px 0 10px; display: flex; align-items: center; gap: 8px; }

/* ---------- Lektionsliste ---------- */
.head { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.head .t { font-size: 26px; font-weight: 600; flex: 1; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 8px; margin-bottom: 8px; scrollbar-width: none; }
.chip { flex: none; padding: 8px 14px; border-radius: 99px; background: #fff; font-weight: 500; font-size: 16px; box-shadow: 0 3px 0 var(--line); }
.chip[aria-pressed="true"] { background: var(--ink); color: #fff; box-shadow: 0 3px 0 #000; }
.units { display: grid; gap: 12px; }
.unit { display: flex; align-items: center; gap: 14px; background: #fff; border-radius: 20px; padding: 12px 14px; box-shadow: var(--sh); text-align: left; width: 100%; border-left: 8px solid var(--c, var(--sky)); }
.unit:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(35, 50, 74, .12); }
.unit .ic { font-size: 34px; width: 48px; text-align: center; flex: none; }
.unit .n { font-weight: 600; font-size: 18px; display: block; }
.unit .stars { font-size: 18px; letter-spacing: 1px; }
.unit .due { font-size: 13px; color: var(--org); font-weight: 600; }
.stars .off { filter: grayscale(1); opacity: .3; }

/* ---------- Übungs-Bildschirm ---------- */
#ses { position: fixed; inset: 0; z-index: 20; background: var(--bg2); display: flex; flex-direction: column; overflow: hidden; }
.ses-top { display: flex; align-items: center; gap: 12px; padding: 12px 16px 6px; max-width: 640px; width: 100%; margin: 0 auto; }
.track { flex: 1; height: 20px; background: #fff; border-radius: 99px; box-shadow: inset 0 2px 0 rgba(0, 0, 0, .06); position: relative; }
.track i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 99px; background: linear-gradient(90deg, var(--grn), var(--mint)); transition: width .4s; }
.track span { position: absolute; top: 50%; transform: translate(-50%, -55%); font-size: 26px; transition: left .4s; }
.ses-body { flex: 1; overflow-y: auto; padding: 8px 16px 140px; max-width: 640px; width: 100%; margin: 0 auto; }
.qcard { background: #fff; border-radius: 26px; box-shadow: var(--sh); padding: 16px; text-align: center; position: relative; margin-bottom: 16px; }
.qtext { font-size: 22px; font-weight: 500; padding: 0 44px; min-height: 46px; display: flex; align-items: center; justify-content: center; }
.qtext.calc { font-size: 40px; font-weight: 600; letter-spacing: 1px; padding: 6px 44px; }
.say-btn { position: absolute; top: 10px; right: 10px; width: 46px; height: 46px; border-radius: 50%; background: var(--sky); color: #fff; font-size: 22px; box-shadow: 0 4px 0 #1c6fc7; display: grid; place-items: center; }
.say-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #1c6fc7; }
.v-big { font-family: "Andika", "Fredoka", sans-serif; font-size: 64px; font-weight: 700; line-height: 1.1; margin: 8px 0; }
.v-word { font-family: "Andika", "Fredoka", sans-serif; font-size: 36px; font-weight: 700; margin: 8px 0; line-height: 1.25; }
.v-word b { color: var(--org); text-decoration: underline; text-decoration-thickness: 3px; }
.v-emo { font-size: 92px; line-height: 1.1; margin: 6px 0; }
.v-cap { font-size: 22px; font-weight: 600; color: var(--muted); }
.qbox { display: inline-block; min-width: 1.1em; padding: 0 .12em; border: 3px dashed var(--sky); border-radius: 10px; color: var(--sky); line-height: 1.1; }
.v-count { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 16px; font-size: 40px; margin: 8px 0; }
.v-count .grp { white-space: nowrap; }
.v-field { display: inline-grid; gap: 6px; padding: 10px; background: #f3f7fb; border-radius: 16px; margin: 8px 0; }
.f-row { display: flex; gap: 5px; }
.f-row i { width: 24px; height: 24px; border-radius: 50%; border: 2px solid #c6d4e3; background: #fff; }
.f-row i.on { background: var(--coral); border-color: #d95b4d; }
.f-row i.gap { margin-left: 10px; }
.v-tens { display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-end; gap: 6px; margin: 10px 0; }
.v-tens u { width: 70px; height: 70px; background: var(--lav); border-radius: 4px; background-image: linear-gradient(rgba(255,255,255,.45) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.45) 1px, transparent 1px); background-size: 7px 7px; }
.v-tens b { width: 10px; height: 70px; background: var(--sky); border-radius: 3px; background-image: linear-gradient(rgba(255,255,255,.6) 1px, transparent 1px); background-size: 10px 7px; }
.v-tens .ones { display: grid; grid-template-columns: repeat(3, 12px); gap: 3px; margin-left: 8px; }
.v-tens .ones i { width: 12px; height: 12px; background: var(--coral); border-radius: 2px; }
.v-pics { font-size: 27px; display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
.v-pics span { white-space: nowrap; }
.v-pics em { font-style: normal; font-weight: 700; font-size: 36px; color: var(--sky); }
.v-pics s { text-decoration: none; position: relative; opacity: .35; }
.v-pics s:after { content: ""; position: absolute; left: 0; right: 0; top: 50%; border-top: 4px solid var(--bad); transform: rotate(-12deg); }
.v-house { display: inline-block; margin: 8px 0; }
.v-house .roof { width: 188px; height: 74px; background: var(--coral); clip-path: polygon(50% 0, 100% 100%, 0 100%); display: flex; align-items: flex-end; justify-content: center; padding-bottom: 6px; color: #fff; font-size: 34px; font-weight: 700; margin: 0 auto; }
.v-house .rooms { display: grid; grid-template-columns: 1fr 1fr; width: 172px; margin: 0 auto; border: 4px solid var(--coral); border-top: 0; background: #fff; font-size: 34px; font-weight: 600; }
.v-house .rooms span { padding: 10px; }
.v-house .rooms span:first-child { border-right: 4px solid var(--coral); }
.v-clock { width: 200px; height: 200px; margin: 6px auto; display: block; }
.v-clock .face { fill: #fff; stroke: var(--sky); stroke-width: 3; }
.v-clock .ticks line { stroke: #9bb0c6; stroke-width: 1; }
.v-clock .nums text { font-size: 10px; font-weight: 600; text-anchor: middle; fill: var(--ink); font-family: "Fredoka", sans-serif; }
.v-clock .hh { stroke: var(--coral); stroke-width: 4.5; stroke-linecap: round; }
.v-clock .mh { stroke: var(--sky); stroke-width: 3; stroke-linecap: round; }
.v-clock .pin { fill: var(--ink); }
.v-frac { width: 150px; height: 150px; margin: 6px auto; display: block; }
.v-frac path, .v-frac circle { fill: #fff; stroke: var(--ink); stroke-width: 1.5; }
.v-frac .on { fill: var(--sun); }
.v-col { margin: 8px auto; border-collapse: collapse; font-size: 36px; font-weight: 600; font-variant-numeric: tabular-nums; }
.v-col td { width: 36px; height: 46px; text-align: center; border: 1px solid #e3ecf5; }
.v-col td.op { color: var(--sky); border: 0; }
.v-col tr.line td { border-top: 4px solid var(--ink); color: var(--sky); }
.v-rect { width: 240px; max-width: 100%; margin: 4px auto; display: block; }
.v-rect rect { fill: #dff1ff; stroke: var(--sky); stroke-width: 3; }
.v-rect text { font-size: 14px; text-anchor: middle; fill: var(--ink); font-family: "Fredoka", sans-serif; font-weight: 600; }
.frac { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; line-height: 1; margin: 0 .25em; font-size: .8em; }
.frac i { font-style: normal; padding: 0 .15em; }
.frac i:first-child { border-bottom: .09em solid currentColor; padding-bottom: .05em; }

.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.opt { background: #fff; border-radius: 20px; min-height: 78px; padding: 10px; font-size: 26px; font-weight: 600; box-shadow: 0 5px 0 var(--line); border: 3px solid var(--line); position: relative; }
.opt:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--line); }
.opts.big .opt { font-family: "Andika", "Fredoka", sans-serif; font-size: 40px; min-height: 92px; }
.opts.emoji .opt { font-size: 56px; min-height: 104px; }
.opts.word .opt { font-size: 21px; }
.opts.n2 { grid-template-columns: 1fr 1fr; }
.opts.n3 { grid-template-columns: 1fr 1fr 1fr; }
.opts.word.long { grid-template-columns: 1fr; }
.opt .lab { display: block; font-size: 14px; font-weight: 500; color: var(--muted); font-family: "Fredoka", sans-serif; }
.opt.ok { background: var(--okbg); border-color: var(--ok); box-shadow: 0 5px 0 var(--ok); }
.opt.bad { background: var(--badbg); border-color: var(--bad); box-shadow: 0 5px 0 var(--bad); animation: shake .35s; }
.opt[disabled] { cursor: default; }
@keyframes shake { 25% { transform: translateX(-7px); } 75% { transform: translateX(7px); } }

/* Ziffernblock */
.ans { background: #fff; border-radius: 20px; min-height: 72px; font-size: 42px; font-weight: 600; display: flex; align-items: center; justify-content: center; border: 3px solid var(--line); margin-bottom: 12px; letter-spacing: 2px; }
.ans.ok { border-color: var(--ok); background: var(--okbg); } .ans.bad { border-color: var(--bad); background: var(--badbg); animation: shake .35s; }
.ans .ph { color: #c3cfdc; }
.pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.pad button { background: #fff; border-radius: 18px; height: 62px; font-size: 30px; font-weight: 600; box-shadow: 0 5px 0 var(--line); border: 2px solid var(--line); }
.pad button:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--line); }
.pad .go { background: var(--ok); color: #fff; border-color: var(--ok); box-shadow: 0 5px 0 #168650; }
.pad .fn { background: #f1f5fa; font-size: 24px; }
.mic { width: 92px; height: 92px; border-radius: 50%; background: var(--coral); color: #fff; font-size: 42px; box-shadow: 0 6px 0 #c6483c; display: grid; place-items: center; margin: 6px auto; }
.mic.small { width: 62px; height: 62px; font-size: 28px; margin: 0; box-shadow: 0 4px 0 #c6483c; }
.mic.on { animation: pulse 1s infinite; background: var(--bad); }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(242, 85, 79, .5); } 100% { box-shadow: 0 0 0 22px rgba(242, 85, 79, 0); } }
.heard { text-align: center; min-height: 28px; color: var(--muted); font-size: 18px; margin: 6px 0; }
.heard b { color: var(--ink); }
.link { color: var(--sky); text-decoration: underline; font-weight: 500; padding: 8px; display: block; margin: 4px auto; font-size: 16px; }
.textin { width: 100%; font-size: 30px; padding: 12px 16px; border-radius: 18px; border: 3px solid var(--line); text-align: center; font-family: "Andika", "Fredoka", sans-serif; background: #fff; }
.textin:focus { outline: none; border-color: var(--sky); }
.diff { font-family: "Andika", "Fredoka", sans-serif; font-size: 26px; }
.diff .x { background: var(--badbg); color: var(--bad); border-radius: 4px; }

/* Schreibfläche */
.padwrap { background: #fff; border-radius: 24px; box-shadow: var(--sh); padding: 6px; position: relative; }
canvas.draw { width: 100%; height: min(58vh, 330px); display: block; touch-action: none; border-radius: 18px; }
.padbar { display: flex; gap: 10px; justify-content: center; margin-top: 12px; flex-wrap: wrap; }
.tstars { font-size: 34px; text-align: center; }

/* Rückmeldung */
.fb { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; padding: 14px 16px calc(16px + env(safe-area-inset-bottom, 0px)); border-radius: 26px 26px 0 0;
  box-shadow: 0 -4px 20px rgba(0, 0, 0, .12); transform: translateY(110%); transition: transform .25s, visibility .25s; background: #fff; visibility: hidden; }
.fb.show { transform: none; visibility: visible; }
.fb.ok { background: var(--okbg); } .fb.bad { background: var(--badbg); } .fb.try { background: #fff4d6; }
.fb-in { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
.fb .msg { display: flex; gap: 10px; align-items: center; font-size: 21px; font-weight: 600; }
.fb .msg .owl { font-size: 40px; }
.fb .sub { font-size: 17px; font-weight: 500; color: var(--ink); }
.fb .sol { font-family: "Andika", "Fredoka", sans-serif; font-size: 28px; font-weight: 700; }
.fb.ok .msg { color: #127a47; } .fb.bad .msg { color: #b8312b; } .fb.try .msg { color: #9a5b00; }

/* Ergebnis */
.result { text-align: center; padding-top: 20px; }
.result .big-stars { font-size: 64px; letter-spacing: 6px; margin: 10px 0; }
.result .big-stars span { display: inline-block; animation: pop .5s backwards; }
.result .big-stars span:nth-child(2) { animation-delay: .2s; } .result .big-stars span:nth-child(3) { animation-delay: .4s; }
@keyframes pop { 0% { transform: scale(0) rotate(-40deg); } 70% { transform: scale(1.3); } }
.sticker-new { font-size: 80px; animation: pop .6s .6s backwards; }
.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 40; overflow: hidden; }
.confetti span { position: absolute; top: -40px; font-size: 26px; animation: fall linear forwards; }
@keyframes fall { to { transform: translateY(110vh) rotate(540deg); } }

/* Fortschritt */
.bar { height: 14px; background: #eef3f8; border-radius: 99px; overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 99px; background: var(--c, var(--grn)); }
.prog-area { display: grid; gap: 6px; padding: 12px 0; border-bottom: 2px dashed var(--line); }
.prog-area:last-child { border-bottom: 0; }
.lgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(40px, 1fr)); gap: 6px; }
.lgrid span { aspect-ratio: 1; border-radius: 12px; display: grid; place-items: center; font-weight: 600; font-size: 20px; background: #eef3f8; color: #9aabbd; font-family: "Andika", "Fredoka", sans-serif; }
.lgrid span.l1 { background: #fff1c2; color: #8a6200; } .lgrid span.l2 { background: #c9f2d9; color: #13703f; } .lgrid span.l3 { background: var(--ok); color: #fff; }
.lgrid span.w { box-shadow: inset 0 0 0 3px var(--bad); }
.x1 { display: grid; grid-template-columns: 26px repeat(10, 1fr); gap: 3px; font-size: 12px; text-align: center; }
.x1 b { font-weight: 600; color: var(--muted); display: grid; place-items: center; }
.x1 span { aspect-ratio: 1; border-radius: 6px; background: #eef3f8; display: grid; place-items: center; color: #9aabbd; }
.x1 span.l1 { background: #fff1c2; color: #8a6200; } .x1 span.l2 { background: #c9f2d9; color: #13703f; } .x1 span.l3 { background: var(--ok); color: #fff; } .x1 span.w { background: var(--badbg); color: var(--bad); }
.legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 13px; color: var(--muted); margin-top: 8px; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 4px; vertical-align: -1px; margin-right: 4px; }

const GLP = {};
let _gsvg = null, _gpath = null;
function glyph(ch) {
  if (GLP[ch]) return GLP[ch];

    _gpath = document.createElementNS(NS, "path");
    _gsvg.appendChild(_gpath);
    document.body.appendChild(_gsvg);
  }
  const strokes = g.slice(1).map(d => {
    _gpath.setAttribute("d", d);
    const L = _gpath.getTotalLength();
    const n = Math.max(1, Math.ceil(L / 1.5)), pts = [];
    for (let i = 0; i <= n; i++) { const p = _gpath.getPointAtLength((L * i) / n); pts.push([p.x, p.y]); }

    const g = glyph(ch);
    if (!g) continue;
    items.push({ ch, g, x });

function polyline(x, pts, dx, lw) {
  if (!pts.length) return;
  const [a0, b0] = pts[0];
  const span = pts.reduce((m, p) => Math.max(m, Math.abs(p[0] - a0) + Math.abs(p[1] - b0)), 0);
  if (pts.length === 1 || span < 1.2) { x.beginPath(); x.arc(a0 + dx, b0, lw / 2, 0, Math.PI * 2); x.fill(); return; }

  x.moveTo(a0 + dx, b0);

function traceScore(lay, kid) {
  const W = Math.ceil((lay.w + 40) * 2), H = 220;
  const mk = draw => {
    const c = document.createElement("canvas");
    c.width = W; c.height = H;
    const x = c.getContext("2d", { willReadFrequently: true });
    x.setTransform(2, 0, 0, 2, 40, 20);
    x.lineCap = x.lineJoin = "round";
    x.strokeStyle = x.fillStyle = "#000";
    draw(x);
    return x.getImageData(0, 0, W, H).data;
  };
  const guide = lw => x => { x.lineWidth = lw; for (const it of lay.items) for (const s of it.g.strokes) polyline(x, s.pts, it.x, s.dot ? lw + 4 : lw); };
  const kidD = lw => x => { x.lineWidth = lw; for (const s of kid) polyline(x, s, 0, lw); };
  const K = mk(guide(3)), G = mk(guide(26)), Cw = mk(kidD(18)), Ct = mk(kidD(3));
  let k = 0, kc = 0, c = 0, cg = 0;
  for (let i = 3; i < K.length; i += 4) {
    if (K[i] > 100) { k++; if (Cw[i] > 100) kc++; }
    if (Ct[i] > 100) { c++; if (G[i] > 100) cg++; }
  }
  return { cov: k ? kc / k : 0, prec: c ? cg / c : 0, ink: c };
}

  const bw = x1 - x0, bh = y1 - y0, m = Math.max(bw, bh, 1), sc = (RN - 10) / m;
  const ox = (RN - bw * sc) / 2 - x0 * sc, oy = (RN - bh * sc) / 2 - y0 * sc;

  c.width = c.height = RN;

  for (const s of strokes) polyline(x, s.map(([a, b]) => [a * sc + ox, b * sc + oy]), 0, 2.6);

const KIDS = [["Paul", "er"], ["Mia", "sie"], ["Ali", "er"], ["Lena", "sie"], ["Tim", "er"], ["Emma", "sie"], ["Noah", "er"], ["Sofia", "sie"], ["Ben", "er"], ["Lara", "sie"]];
const DING = [
  { e: "🍎", sg: "Apfel", pl: "Äpfel", dat: "Äpfeln", weg: "fallen auf den Boden" },
  { e: "🍬", sg: "Bonbon", pl: "Bonbons", dat: "Bonbons", weg: "isst {er} auf" },
  { e: "🎈", sg: "Luftballon", pl: "Luftballons", dat: "Luftballons", weg: "fliegen davon" },
  { e: "✏️", sg: "Stift", pl: "Stifte", dat: "Stiften", weg: "verliert {er}" },
  { e: "🍪", sg: "Keks", pl: "Kekse", dat: "Keksen", weg: "isst {er} auf" },
  { e: "🚗", sg: "Spielzeugauto", pl: "Spielzeugautos", dat: "Spielzeugautos", weg: "verschenkt {er}" },
  { e: "🌸", sg: "Blume", pl: "Blumen", dat: "Blumen", weg: "verschenkt {er}" },
  { e: "🥚", sg: "Ei", pl: "Eier", dat: "Eiern", weg: "gehen kaputt" },
  { e: "⭐", sg: "Sticker", pl: "Sticker", dat: "Stickern", weg: "klebt {er} in sein Heft" },
  { e: "🔵", sg: "Murmel", pl: "Murmeln", dat: "Murmeln", weg: "rollen unter das Sofa" },
  { e: "🍓", sg: "Erdbeere", pl: "Erdbeeren", dat: "Erdbeeren", weg: "isst {er} auf" }
];
const cap = w => w[0].toUpperCase() + w.slice(1);
const anz = (n, d) => `${n} ${n === 1 ? d.sg : d.pl}`;
function twoKids() { const [a, b] = sample(KIDS, 2); return [a, b]; }
/* „weg“-Satz: „2 Äpfel fallen auf den Boden.“ / „2 Kekse isst er auf.“ (Verb vorne bei „{er}“) */
function wegSatz(d, n, er) {
  if (d.weg.includes("{er}")) { const w = d.weg.replace("{er}", er).replace("sein Heft", er === "sie" ? "ihr Heft" : "sein Heft"); return `${anz(n, d)} ${w}.`; }
  return `${anz(n, d)} ${d.weg}.`;
}
function textTask(q, a, hint, o = {}) { return N(q, a, { hint, say: o.say || q, cls: "", key: undefined, ...o }); }
const euroTxt = c => (c % 100 ? `${Math.floor(c / 100)},${pad2(c % 100)} €` : `${c / 100} €`);
const euroSay = c => (c < 100 ? `${c} Cent` : c % 100 ? `${Math.floor(c / 100)} Euro ${c % 100}` : `${c / 100} Euro`);
function sachTask(cls, max) {
  const [[n, er], [m]] = twoKids(), d = pick(DING), Er = cap(er);
  const k = R(0, 99);
  if (cls === 1) {
    const kind = k % 5;
    if (kind === 0) { const a = R(1, max - 1), b = R(1, max - a); return textTask(`${n} hat ${anz(a, d)}. ${Er} bekommt ${b} dazu. Wie viele ${d.pl} hat ${er} jetzt?`, a + b, `${a} + ${b} = ${a + b}`, { vis: max <= 10 ? V.pics(a, "+", b, d.e) : V.emo(d.e) }); }
    if (kind === 1) { const a = R(3, max), b = R(2, a - 1); return textTask(`${n} hat ${anz(a, d)}. ${wegSatz(d, b, er)} Wie viele ${d.pl} hat ${er} noch?`, a - b, `${a} − ${b} = ${a - b}`, { vis: max <= 10 ? V.pics(a, "−", b, d.e) : V.emo(d.e) }); }
    if (kind === 2) { const a = R(1, max - 1), b = R(1, max - a); return textTask(`${n} hat ${anz(a, d)}. ${m} hat ${anz(b, d)}. Wie viele ${d.pl} haben beide zusammen?`, a + b, `${a} + ${b} = ${a + b}`, { vis: max <= 10 ? V.pics(a, "+", b, d.e) : V.emo(d.e) }); }
    if (kind === 3) { const a = R(3, max), b = R(2, a - 1); return textTask(`Im Bus sitzen ${a} Kinder. An der Haltestelle steigen ${b} Kinder aus. Wie viele Kinder sitzen noch im Bus?`, a - b, `${a} − ${b} = ${a - b}`, { vis: V.emo("🚌") }); }
    const a = R(2, max), b = R(1, a - 1); return textTask(`${n} hat ${anz(a, d)}. ${m} hat ${anz(b, d)}. Wie viele ${d.pl} hat ${n} mehr als ${m}?`, a - b, `${a} − ${b} = ${a - b}`, { vis: V.emo(d.e) });
  }
  if (cls === 2) {
    const kind = k % 6;
    if (kind === 0) { const p = R(2, 10), j = R(2, 10); return textTask(`${n} kauft ${p} Tüten mit je ${j} ${j === 1 ? d.sg : d.dat}. Wie viele ${d.pl} sind das zusammen?`, p * j, `${p} · ${j} = ${p * j}`, { vis: V.emo(d.e) }); }
    if (kind === 1) { const kinder = R(2, 6), j = R(2, 10), x = kinder * j; return textTask(`${n} verteilt ${x} ${d.pl} gerecht an ${kinder} Kinder. Wie viele ${d.pl} bekommt jedes Kind?`, j, `${x} : ${kinder} = ${j}`, { vis: V.emo(d.e) }); }
    if (kind === 2) { const g = R(20, 100), p = R(5, g - 1); return textTask(`${n} hat ${g} €. ${Er} kauft ein Spiel für ${p} €. Wie viel Geld hat ${er} noch?`, g - p, `${g} − ${p} = ${g - p}`, { vis: V.emo("💶") }); }
    if (kind === 3) { const t = pick([["Hunde", 4, "🐶"], ["Katzen", 4, "🐱"], ["Hühner", 2, "🐔"], ["Enten", 2, "🦆"], ["Spinnen", 8, "🕷️"]]), z = R(2, 10); return textTask(`Auf dem Hof sind ${z} ${t[0]}. Wie viele Beine haben sie zusammen?`, z * t[1], `Jedes Tier hat ${t[1]} Beine: ${z} · ${t[1]} = ${z * t[1]}`, { vis: V.emo(t[2]) }); }
    if (kind === 4) { const a = R(20, 80), b = R(5, 100 - a); return textTask(`In der Klasse 2a sind ${a} Bücher im Regal. Die Lehrerin bringt ${b} neue Bücher mit. Wie viele Bücher sind es jetzt?`, a + b, `${a} + ${b} = ${a + b}`, { vis: V.emo("📚") }); }
    const a = R(30, 100), b = R(5, a - 10); return textTask(`${n} hat ${a} Sticker. ${Er} schenkt ${m} ${b} Sticker. Wie viele Sticker hat ${er} noch?`, a - b, `${a} − ${b} = ${a - b}`, { vis: V.emo("⭐") });
  }
  if (cls === 3) {
    const kind = k % 5;
    if (kind === 0) { const a = R(120, 500), b = R(100, 1000 - a); return textTask(`Ein Fahrrad kostet ${a} €, ein Helm ${b - b % 5} €. Wie viel kostet beides zusammen?`, a + b - b % 5, `${a} + ${b - b % 5} = ${a + b - b % 5}`, { vis: V.emo("🚲") }); }
    if (kind === 1) { const kinder = R(20, 30), plaetze = pick([4, 5, 6]); const autos = Math.ceil(kinder / plaetze); return textTask(`${kinder} Kinder fahren zum Ausflug. In jedes Auto passen ${plaetze} Kinder. Wie viele Autos braucht man mindestens?`, autos, `${kinder} : ${plaetze} = ${Math.floor(kinder / plaetze)} Rest ${kinder % plaetze}${kinder % plaetze ? " → für den Rest braucht man noch ein Auto" : ""}. Also ${autos} Autos.`, { vis: V.emo("🚗") }); }
    if (kind === 2) { const h = R(2, 9), p = R(2, 6), z = pick([20, 50]); if (h * p >= z) return null; return textTask(`${n} kauft ${h} Hefte zu je ${p} €. ${Er} bezahlt mit einem ${z}-€-Schein. Wie viel Geld bekommt ${er} zurück?`, z - h * p, `${h} · ${p} = ${h * p} €, ${z} − ${h * p} = ${z - h * p} €`, { vis: V.emo("💶") }); }
    if (kind === 3) { const r = R(3, 9), j = R(4, 9); return textTask(`Im Garten stehen ${r} Reihen mit je ${j} Blumen. Wie viele Blumen sind es?`, r * j, `${r} · ${j} = ${r * j}`, { vis: V.emo("🌷") }); }
    const a = R(300, 900), b = R(50, a - 100); return textTask(`Bis zu Omas Haus sind es ${a} m. ${n} ist schon ${b} m gelaufen. Wie viele Meter fehlen noch?`, a - b, `${a} − ${b} = ${a - b}`, { vis: V.emo("🏡"), say: `Bis zu Omas Haus sind es ${a} Meter. ${n} ist schon ${b} Meter gelaufen. Wie viele Meter fehlen noch?` });
  }

    const kind = k % 5;

function shapeD(f) {

  if (f[0] === "c") { const [, x, y, r] = f; return `M${n(x - r)} ${n(y)} A${n(r)} ${n(r)} 0 1 0 ${n(x + r)} ${n(y)} A${n(r)} ${n(r)} 0 1 0 ${n(x - r)} ${n(y)} Z`; }

  if (f[0] === "r") { const [, x, y, w, h] = f; return `M${x} ${y} h${w} v${h} h${-w} Z`; }
  if (f[0] === "p") return "M" + f[1].trim().split(/\s+/).join(" L") + " Z";
  if (f[0] === "l") return "M" + f[1].trim().split(/\s+/).join(" L");
  return f[1];
}

/* ---------- Ausmalbild auswählen ---------- */
function pickTemplate() {
  const d = document.createElement("div");
  d.className = "modal";
  d.innerHTML = `<div class="modal-box tpl-box"><div class="row"><b style="font-size:22px" class="sp">🖍️ Ausmalbilder</b><button class="icon-btn" data-tpl-close aria-label="Schließen">✖</button></div>

  d.addEventListener("click", e => {
    const b = e.target.closest("[data-tpl],[data-tpl-close]");
    if (!b && e.target !== d) return;
    e.stopPropagation(); d.remove();
    if (!b || b.hasAttribute("data-tpl-close")) return;
    const id = b.dataset.tpl;
    const start = () => { newDrawing(id); PNT.mode = id ? "fill" : "pen"; if (PNT.c === "#ffffff") PNT.c = "#3a9cff"; renderPaint(); if (id) toast("🪣 Farbe wählen und in die Flächen tippen!"); };
    if (PDOC && PDOC.shapes.length) ask("Neues Bild anfangen?<br><small>Das jetzige Bild ist dann weg – vorher 💾 speichern!</small>", "Ja, neues Bild", "Nein", "🖍️").then(ok => ok && start());
    else start();
  });
  document.body.appendChild(d);
}
function paintFull(on) {

    if (on && document.documentElement.requestFullscreen && !document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});

}

/* ---------- Bild speichern / schicken ---------- */
/* Bild-Datei aus dem Bild erzeugen */
function picFile(src) {
  const [head, data] = src.split(","), type = (head.match(/data:(.*?);/) || [, "image/png"])[1];
  const bin = atob(data), u = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  const d = new Date(), name = `Lern-App-Bild-${dayStr(d)}-${pad2(d.getHours())}${pad2(d.getMinutes())}${pad2(d.getSeconds())}.${type === "image/png" ? "png" : "jpg"}`;
  return new File([u], name, { type });
}
function downloadFile(file) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(file); a.download = file.name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
/* Bild als Datei aufs Handy (Ordner „Downloads“). Verschicken per WhatsApp gibt es seit 1.8.1 nicht mehr (Wunsch des Nutzers, klappte dort nicht). */
function exportPic(src) {
  try { downloadFile(picFile(src)); return Promise.resolve(true); }
  catch (e) { toast("Das Bild konnte nicht gespeichert werden."); return Promise.resolve(false); }
}
function savePaint() { // in „Meine Bilder“ und als Bild-Datei aufs Handy (Ordner „Downloads“)
  if (!PAINT || !PDOC.shapes.length) return toast("Male zuerst etwas! 🖍️");
  const snap = PAINT.snapshot("image/png"), img = new Image();
  img.onload = () => {
    const w = 480, h = Math.round((img.height / img.width) * w), c = document.createElement("canvas");
    c.width = w; c.height = h; c.getContext("2d").drawImage(img, 0, 0, w, h);
    const pics = loadPics(); pics.unshift(c.toDataURL("image/jpeg", 0.72));
    while (pics.length > 12) pics.pop();
    try { localStorage.setItem(picKey(), JSON.stringify(pics)); } catch (e) { pics.pop(); try { localStorage.setItem(picKey(), JSON.stringify(pics.slice(0, 6))); } catch (e2) {} }
    if (!PAINT_FULL) renderPaint();
  };
  img.src = snap;
  exportPic(snap).then(ok => { if (ok) toast("Gespeichert! 🖼️ Unter „Meine Bilder“ und auf dem Handy im Ordner „Downloads“."); });
  confetti(14); tone([523, 659, 784]);
}

/* Klicks im Malbereich (aus dem allgemeinen Klick-Verteiler) – true = erledigt */
function paintClick(ds, el, act) {
  if (ds.color) { PNT.c = ds.color; if (PNT.mode !== "fill") PNT.mode = "pen"; paintSync(); return true; }
  if (ds.mode) { PNT.mode = ds.mode; paintSync(); return true; }
  if (ds.width) { PNT.w = Number(ds.width); if (PNT.mode === "stamp" || PNT.mode === "fill") PNT.mode = "pen"; paintSync(); return true; }
  if (ds.stamp) { PNT.stamp = ds.stamp; PNT.mode = "stamp"; paintSync(); return true; }
  if (ds.delpic !== undefined) { ask("Dieses Bild löschen?", "Löschen", "Nein", "🗑️").then(ok => { if (!ok) return; const p = loadPics(); p.splice(Number(ds.delpic), 1); localStorage.setItem(picKey(), JSON.stringify(p)); renderPaint(); }); return true; }
  if (ds.exppic !== undefined) { const src = loadPics()[Number(ds.exppic)]; if (src) exportPic(src); return true; }
  switch (act) {
    case "paint-undo": if (PAINT) PAINT.undo(); return true;
    case "paint-clear": if (PDOC && PDOC.shapes.length) ask("Alles wegmachen und neu anfangen?", "Ja, alles weg", "Nein", "🗑️").then(ok => { if (ok) { PDOC.shapes = []; renderPaint(); } }); return true;
    case "paint-save": savePaint(); return true;
    case "paint-tpl": pickTemplate(); return true;
    case "paint-full": pushLayer(() => paintFull(false)); paintFull(true); return true;
    case "paint-small": back(); return true;
    case "stamp-bigger": if (PAINT) PAINT.scaleSel(1.25); return true;
    case "stamp-smaller": if (PAINT) PAINT.scaleSel(0.8); return true;
  }
  return false;
}

/* ======================= LERN-APP KLASSE 1–6 =======================
   Speicher: localStorage „lernapp_v1“ (alle Kinder), Bilder je Kind „lernapp_bilder_<id>“. */
"use strict";
const APP_VER = "1.8.1";
const STORE = "lernapp_v1";

/* ---------- Speicher ---------- */
function loadG() {
  let o = {};
  try { const r = localStorage.getItem(STORE); if (r) o = JSON.parse(r) || {}; } catch (e) { o = {}; }
  o.profiles = Array.isArray(o.profiles) ? o.profiles : [];
  o.data = o.data || {};
  o.set = Object.assign({ auto: true, sfx: true, voice: "", rate: 1, goal: 15 }, o.set || {});
  delete o.set.style; delete o.set.vmap; // Vorlese-Figuren gibt es seit 1.3 nicht mehr
  return o;
}
let G = loadG();
function save() {
  const d = G.cur && G.data[G.cur];
  if (d && Object.keys(d.rev).length > 700) { // älteste, gut gekonnte Einträge zuerst entfernen
    const ks = Object.entries(d.rev).sort((a, b) => (b[1].b - a[1].b) || (a[1].d - b[1].d)).slice(0, 100).map(x => x[0]);
    ks.forEach(k => delete d.rev[k]);
  }
  try { localStorage.setItem(STORE, JSON.stringify(G)); } catch (e) { toast("Speichern hat nicht geklappt (Speicher voll?)."); }
}
const P = () => G.profiles.find(p => p.id === G.cur) || null;
function D() {
  const p = P();
  if (!p) return null;
  const d = (G.data[p.id] = G.data[p.id] || {});
  d.xp = d.xp || 0; d.stars = d.stars || {}; d.plays = d.plays || {}; d.rev = d.rev || {}; d.hist = d.hist || {}; d.stk = d.stk || []; d.ok = d.ok || 0; d.all = d.all || 0;
  return d;
}
const dayStr = (d = new Date()) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const dayNum = (d = new Date()) => Math.floor((d.getTime() - d.getTimezoneOffset() * 60000) / 86400000);
const todayN = () => (D() ? D().hist[dayStr()] || 0 : 0);
function streak() {
  const h = D().hist; let n = 0; const d = new Date();
  if (!h[dayStr(d)]) d.setDate(d.getDate() - 1);
  while (h[dayStr(d)]) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
const level = xp => ({ n: Math.floor(xp / 150) + 1, p: (xp % 150) / 150 });
const IVL = [0, 1, 2, 4, 8, 16];
const UNIT_IVL = [1, 3, 7, 14, 30];
function unitDue(uid) {
  const pl = D().plays[uid];
  if (!pl) return false;
  return dayNum() - pl.last >= UNIT_IVL[Math.min(pl.n - 1, 4)];
}
function revDue() { const t = dayNum(); return Object.values(D().rev).filter(r => r.d <= t && r.t); }

/* ---------- Helfer ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => (t.hidden = true), 2800); }
const fracHtml = s => s.replace(/(\d+)\/(\d+)/g, '<span class="frac"><i>$1</i><i>$2</i></span>');
const plain = s => String(s).replace(/<[^>]+>/g, "").replace(/&nbsp;/g, " ");
function lev(a, b) {
  const m = a.length, n = b.length, d = Array.from({ length: m + 1 }, (_, i) => [i]);
  for (let j = 1; j <= n; j++) d[0][j] = j;
  for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++) d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return d[m][n];
}
const starsHtml = n => `<span class="stars">${[1, 2, 3].map(i => `<span class="${n >= i ? "" : "off"}">⭐</span>`).join("")}</span>`;

/* ======================= SPRACHE: Vorlesen ======================= */
let VOICES = [];
function loadVoices() { try { VOICES = (speechSynthesis.getVoices() || []).filter(v => /^de/i.test(v.lang)); } catch (e) { VOICES = []; } }
if ("speechSynthesis" in window) { loadVoices(); speechSynthesis.addEventListener && speechSynthesis.addEventListener("voiceschanged", loadVoices); }
function pickVoice() {
  const own = G.set.voice && VOICES.find(v => v.name === G.set.voice);
  if (own) return own;
  const nice = v => /google|natural|enhanced|premium|neural/i.test(v.name);
  const de = VOICES.filter(v => /de[-_]DE/i.test(v.lang));
  return de.find(nice) || de[0] || VOICES.find(nice) || VOICES[0] || null;
}
const DEN = { 2: "Halbe", 3: "Drittel", 4: "Viertel", 5: "Fünftel", 6: "Sechstel", 7: "Siebtel", 8: "Achtel", 9: "Neuntel", 10: "Zehntel", 12: "Zwölftel", 100: "Hundertstel" };
function speechText(s) {
  return plain(s)
    .replace(/[\p{Extended_Pictographic}\u{1F1E6}-\u{1F1FF}\u{1F3FB}-\u{1F3FF}\uFE0F\u200D]/gu, "").replace(/^[\s,]+/, "")
    .replace(/\bABC\b/g, "A B C")
    .replace(/[A-ZÄÖÜ]{3,}/g, w => (/^(SOS|USA|DNA|DNS|LKW|WC)$/.test(w) ? w : w.toLowerCase().replace(/^gross$/, "groß").replace(/^süss$/, "süß")))
    .replace(/(^|[\s(])-(\d)/g, "$1minus $2") // GROSSBUCHSTABEN-Wörter nicht buchstabieren
    .replace(/\((−?\d+)\)/g, "$1").replace(/\(([^()]*\d[^()]*)\)/g, " Klammer auf $1 Klammer zu ").replace(/ \+ /g, " plus ").replace(/\s*=\s*\?\s*$/g, " ist wie viel?").replace(/ = /g, " ist gleich ")
    .replace(/(\d+)\/(\d+)/g, (m, n, d) => (d === "2" && n === "1" ? "ein halb" : DEN[d] ? `${n === "1" ? "ein" : n} ${DEN[d]}` : `${n} durch ${d}`))
    .replace(/(\d) (\d)/g, "$1$2")
    .replace(/·/g, " mal ").replace(/(\d|\)) : (\d|\()/g, "$1 geteilt durch $2").replace(/−\s?(\d)/g, "minus $1").replace(/ − /g, " minus ")
    .replace(/ ≈ \?/g, ". Ungefähr wie viel?").replace(/≈/g, " ungefähr ").replace(/²/g, " hoch 2").replace(/³/g, " hoch 3").replace(/°C/g, " Grad").replace(/___/g, " … ")
    .replace(/→|–/g, ", ");
}
function say(text, rate = 1) {
  if (!text || !("speechSynthesis" in window)) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(speechText(text)), v = pickVoice();
    if (v) u.voice = v;
    u.lang = v ? v.lang : "de-DE";
    u.pitch = 1.05;
    u.rate = 0.9 * G.set.rate * rate;
    speechSynthesis.speak(u);
  } catch (e) {}
}
const stopSay = () => { try { speechSynthesis.cancel(); } catch (e) {} };

/* ======================= SPRACHE: Spracherkennung (wie im Vokabelheft) ======================= */
function joinResults(results) {

const normDe = s => String(s).toLowerCase().replace(/[.,!?;:"„“”'’…()]/g, " ").replace(/-/g, " ").replace(/\s+/g, " ").trim();

  const h = normDe(heard), toks = h.split(" ").filter(w => !FILL.has(w));
  for (const a of answers) {

    if (!v) continue;
    if ((" " + h + " ").includes(" " + v + " ")) return true;
    if (!v.includes(" ")) { for (const w of toks) { const tol = v.length >= 9 ? 2 : v.length >= 4 ? 1 : 0; if (lev(w, v) <= tol) return true; } }
    else if (lev(toks.join(" "), v) <= Math.floor(v.length / 6)) return true;
  }

}
/* „vierundzwanzig“ → 24, „minus drei“ → -3, „zwei Komma fünf“ → 2.5 */
const NW = [["siebzehn", 17], ["sechzehn", 16], ["dreizehn", 13], ["vierzehn", 14], ["fünfzehn", 15], ["achtzehn", 18], ["neunzehn", 19], ["zwanzig", 20], ["dreißig", 30], ["dreissig", 30], ["vierzig", 40], ["fünfzig", 50], ["sechzig", 60], ["siebzig", 70], ["achtzig", 80], ["neunzig", 90], ["hundert", "H"], ["tausend", "T"], ["millionen", "M"], ["million", "M"], ["zwölf", 12], ["sieben", 7], ["sechs", 6], ["eins", 1], ["eine", 1], ["ein", 1], ["zwei", 2], ["zwo", 2], ["drei", 3], ["vier", 4], ["fünf", 5], ["acht", 8], ["neun", 9], ["zehn", 10], ["elf", 11], ["null", 0], ["und", "U"]];
function wordsToInt(s) {
  let total = 0, cur = 0, any = false, i = 0;
  while (i < s.length) {
    const m = NW.find(([w]) => s.startsWith(w, i));
    if (!m) return null;
    i += m[0].length; any = true;
    const v = m[1];
    if (v === "U") continue;
    if (v === "H") cur = (cur || 1) * 100;
    else if (v === "T") { total += (cur || 1) * 1000; cur = 0; }
    else if (v === "M") { total += (cur || 1) * 1e6; cur = 0; }

}
function parseSpokenNum(text) {
  let s = normDe(text).replace(/(\d)\s+(?=\d{3}\b)/g, "$1").replace(/(\d)\.(\d{3})/g, "$1$2");
  const neg = /\bminus\b|^−|^-/.test(s);
  const dm = s.match(/-?\d+(?:[.,]\d+)?/);
  if (dm) { const n = Number(dm[0].replace(",", ".")); return neg && n > 0 ? -n : n; }
  s = s.replace(/\bminus\b/g, "").replace(/\s+/g, "");
  const [a, b] = s.split("komma");
  const ia = wordsToInt(a || "");
  if (ia === null) return null;
  let n = ia;
  if (b) { const digs = [...b].length ? b : ""; const ib = wordsToInt(digs); if (ib !== null) n = Number(ia + "." + ib); }
  return neg ? -n : n;
}

let AC = null;
function tone(notes, type = "sine", gap = 0.09, len = 0.22, vol = 0.12) {

    notes.forEach((f, i) => {
      const o = AC.createOscillator(), g = AC.createGain();

      o.connect(g).connect(AC.destination); o.start(t + i * gap); o.stop(t + i * gap + len + 0.03);
    });
  } catch (e) {}
}

/* Was beim Start einer Aufgabe vorgelesen wird */
function introSpeech(t) {
  const q = plain(t.q);
  let txt = t.say || q;
  // Hör-Aufgaben (z. B. „Welche Zahl hörst du?“): erst die Frage, dann das Gehörte
  if (t.autoSay && t.say && t.say !== q) txt = q + " … " + t.say;
  // Klasse 1–2: Antwort-Wörter mit vorlesen, weil viele Kinder noch nicht gut lesen
  const p = P();
  if (t.type === "choice" && (t.ot || "word") === "word" && p && p.cls <= 2 && SES && SES.opts) {
    const o = SES.opts.map(x => speechText(x).trim()).filter(Boolean);
    const same = new Set(o.map(x => x.toLowerCase())).size < o.length;
    if (!same && o.length > 1 && o.join(" ").length < 120) txt += " … " + o.slice(0, -1).join(", ") + " oder " + o[o.length - 1] + "?";
  }
  return txt;
}

/* ---- Antworten ---- */
function maxTries(t) { if (t.type === "choice") return t.opts.length <= 2 ? 1 : 2; if (t.type === "speak") return 2; return 2; }
function wrong(msg) {
  const t = curT();
  SES.tries++;
  if (SES.tries >= maxTries(t)) return finish(false);
  sfx(false);
  showFb("try", `<div class="msg"><span class="owl">🦉</span>${msg || "Fast! Versuch es nochmal."}</div>`, false);
  setTimeout(() => { if (SES && !SES.answered) hideFb(); }, 1800);
}
function answerText(t) {
  if (t.type === "speak") return esc(t.word);
  if (t.type === "trace" || t.type === "write") return esc(t.g);
  if (t.type === "type") return esc(t.a);
  if (t.type === "num") return esc(fmtN(Number(t.a)));
  return fracHtml(esc(t.a));
}
function record(t, ok) {
  const d = D();
  d.all++; if (ok) d.ok++;
  const k = dayStr(); d.hist[k] = (d.hist[k] || 0) + 1;
  if (t.key) {
    const r = d.rev[t.key] || { b: 0, d: 0, n: 0, w: 0 };
    r.n++;
    if (ok) r.b = Math.min(5, r.b + 1); else { r.b = 0; r.w++; }
    r.d = dayNum() + IVL[r.b];
    const copy = { ...t }; delete copy.again; r.t = copy;
    d.rev[t.key] = r;
  }
}
function finish(ok, extra = "") {
  const t = curT();
  if (SES.answered) return;
  SES.answered = true; stopListen();
  const first = ok && SES.tries === 0;
  if (!t.again) { record(t, first); if (first) SES.ok++; SES.xp += first ? 10 : ok ? 5 : 0; }
  else SES.xp += ok ? 3 : 0;
  if (!first && !t.again && SES.again < 5) { SES.again++; SES.tasks.push({ ...t, again: true }); }
  save();
  sfx(ok);
  if (t.labels) markLabels(t);
  if (ok) {
    const p = pick(PRAISE);
    showFb("ok", `<div class="msg"><span class="owl">🦉</span>${p}</div>${extra}${t.type === "choice" && t.hint && SES.tries ? `<div class="sub">${esc(t.hint)}</div>` : ""}`);
    if (G.set.auto) say(p);
  } else {
    if (t.type === "choice") document.querySelectorAll(".opt").forEach((b, i) => { if (SES.opts[i] === t.a) b.classList.add("ok"); b.disabled = true; });
    if (t.type === "trace" || t.type === "write") PADS && PADS.showSolution();
    showFb("bad", `<div class="msg"><span class="owl">🦉</span>Schau mal, so ist es richtig:</div><div class="sub sol">${answerText(t)}</div>${extra}${t.hint ? `<div class="sub">💡 ${esc(t.hint)}</div>` : ""}`);
    say(solutionSpeech(t));
  }
}
/* richtige Lösung zum Vorlesen (nie „undefined“: Schreib-Aufgaben haben ihre Lösung in t.g) */
function solutionSpeech(t) {
  if (t.type === "speak") return t.word || "";
  if (t.type === "trace" || t.type === "write") return t.g || "";
  if (t.ot === "emoji") return (t.labels && t.labels[t.a]) || "";
  return t.a == null ? "" : plain(t.a);
}
function markLabels(t) { document.querySelectorAll(".opt").forEach((b, i) => { const l = t.labels[SES.opts[i]]; if (l && !b.querySelector(".lab")) b.insertAdjacentHTML("beforeend", `<span class="lab">${esc(l)}</span>`); }); }
function choose(i, el) {
  const t = curT();
  if (SES.answered || el.disabled) return;
  const o = SES.opts[i];
  if (o === t.a) { el.classList.add("ok"); document.querySelectorAll(".opt").forEach(b => (b.disabled = true)); finish(true); }
  else { el.classList.add("bad"); el.disabled = true; wrong(); }
}
function numKey(k) {
  if (SES.answered) return;
  const t = curT();
  if (k === "ok") return checkNum();
  if (k === "del") SES.inp = SES.inp.slice(0, -1);
  else if (k === "c") SES.inp = "";
  else if (k === "−") SES.inp = SES.inp.startsWith("−") ? SES.inp.slice(1) : "−" + SES.inp;
  else if (k === ",") { if (!SES.inp.includes(",")) SES.inp = (SES.inp || "0") + ","; }
  else if (SES.inp.replace(/\D/g, "").length < 9) SES.inp += k;
  void t; showInp();
}
function showInp(cls = "") { const a = $("#ans"); if (!a) return; a.className = "ans sp " + cls; a.innerHTML = SES.inp ? esc(SES.inp) : `<span class="ph">?</span>`; }
const numVal = s => Number(String(s).replace("−", "-").replace(",", "."));
function checkNum() {
  const t = curT();
  if (!SES.inp || SES.inp === "−") return toast("Tippe zuerst eine Zahl ein.");
  if (Math.abs(numVal(SES.inp) - Number(t.a)) < 1e-9) { showInp("ok"); finish(true); }
  else { showInp("bad"); SES.inp = ""; setTimeout(() => SES && !SES.answered && showInp(), 600); wrong(); }
}
function micNum(btn) {

    SES.inp = fmtN(n).replace(/ /g, ""); showInp(); checkNum();
  });
}
function micSpeak(btn) {
  const t = curT();

function tapInstead() {

function checkType() {

  if (SES.tries + 1 >= maxTries(t)) {

function showResult() {

    <div class="v-emo">🦉</div><h1>${msg}</h1>
    <div class="big-stars">${[1, 2, 3].map(i => `<span style="${st >= i ? "" : "filter:grayscale(1);opacity:.25"}">⭐</span>`).join("")}</div>
    <p style="font-size:20px">${SES.ok} von ${SES.n} gleich beim ersten Mal richtig<br><b>+${SES.xp} Punkte</b></p>
    ${sticker ? `<div class="card" style="margin:16px 0"><div class="muted">Neuer Sticker für dein Album!</div><div class="sticker-new">${sticker}</div></div>` : ""}
    <div class="padbar" style="flex-direction:column;align-items:stretch">
      ${SES.uid !== "rev" ? `<button class="btn orange wide" data-act="again">🔄 Nochmal üben</button>` : ""}
      <button class="btn green wide" data-act="ses-done">Fertig ✓</button></div></div>`;
  if (st >= 2) { confetti(); fanfare(); } else tone([523, 659]);
  if (G.set.auto) say(msg);
}
function showFb(kind, html, withNext = true) {
  const f = $("#fb");
  f.className = "fb show " + kind;
  f.innerHTML = `<div class="fb-in">${html}${withNext ? `<button class="btn ${kind === "ok" ? "green" : "orange"} wide" data-act="next">Weiter ➜</button>` : ""}</div>`;
}
function hideFb() { const f = $("#fb"); if (f) f.className = "fb"; }

/* ======================= SCHREIBFLÄCHE (Nachspuren / frei schreiben) ======================= */
let PADS = null;
function makePad(cv, t) {
  const ctx = cv.getContext("2d"), lay = layoutText(t.g), trace = t.type === "trace";
  const kid = [];
  let cur = null, demo = null, sol = false, s = 1, ox = 0, oy = 0, W = 0, H = 0;
  function size() {
    const r = cv.getBoundingClientRect(), dpr = devicePixelRatio || 1;
    W = r.width; H = r.height; cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const lw = trace ? lay.w : Math.max(lay.w, 64);
    s = Math.min((W - 28) / lw, (H - 12) / 102);
    ox = (W - lay.w * s) / 2; oy = (H - 100 * s) / 2 + 4 * s;
    draw();
  }
  const toG = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left - ox) / s, (e.clientY - r.top - oy) / s]; };
  function draw() {
    ctx.clearRect(0, 0, W, H);
    const Y = gy => oy + gy * s;
    ctx.fillStyle = "#fff7d1"; ctx.fillRect(0, Y(40), W, Y(70) - Y(40));
    for (const [y, c, w] of [[10, "#bcd5ee", 1.5], [40, "#bcd5ee", 1.5], [70, "#ef8f8f", 2.2], [92, "#bcd5ee", 1.5]]) { ctx.strokeStyle = c; ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(0, Y(y)); ctx.lineTo(W, Y(y)); ctx.stroke(); }
    ctx.save(); ctx.translate(ox, oy); ctx.scale(s, s); ctx.lineCap = ctx.lineJoin = "round";
    if (trace || sol) {
      ctx.strokeStyle = ctx.fillStyle = sol && !trace ? "rgba(34,180,107,.28)" : "#e4dcf8"; ctx.lineWidth = 15;
      for (const it of lay.items) for (const st of it.g.strokes) polyline(ctx, st.pts, it.x, st.dot ? 17 : 15);
      ctx.setLineDash([2, 4]); ctx.lineWidth = 1.2; ctx.strokeStyle = "#a493dc";
      for (const it of lay.items) for (const st of it.g.strokes) if (!st.dot) polyline(ctx, st.pts, it.x, 1.2);
      ctx.setLineDash([]);
      if (trace) for (const it of lay.items) it.g.strokes.forEach((st, k) => {
        const [x0, y0] = st.pts[0], j = Math.min(st.pts.length - 1, 6), [x1, y1] = st.pts[j], a = Math.atan2(y1 - y0, x1 - x0);
        ctx.fillStyle = "#22b46b"; ctx.beginPath(); ctx.arc(x0 + it.x, y0, 4.6, 0, Math.PI * 2); ctx.fill();
        if (!st.dot) { ctx.save(); ctx.translate(x0 + it.x + Math.cos(a) * 8, y0 + Math.sin(a) * 8); ctx.rotate(a); ctx.beginPath(); ctx.moveTo(3, 0); ctx.lineTo(-2, -2.6); ctx.lineTo(-2, 2.6); ctx.closePath(); ctx.fill(); ctx.restore(); }
        ctx.fillStyle = "#fff"; ctx.font = "600 6px Fredoka, sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(String(k + 1), x0 + it.x, y0 + 0.4);
      });
    }
    ctx.strokeStyle = ctx.fillStyle = "#2e6be6"; ctx.lineWidth = 8;
    for (const st of kid) polyline(ctx, st, 0, 8);
    if (demo) {
      let left = demo.p;
      ctx.strokeStyle = ctx.fillStyle = "#ff9532"; ctx.lineWidth = 9;
      for (const it of lay.items) for (const st of it.g.strokes) {
        if (left <= 0) break;
        const n = Math.min(st.pts.length, Math.ceil(left));
        polyline(ctx, st.pts.slice(0, n), it.x, 9);
        if (left < st.pts.length) { const [px, py] = st.pts[n - 1]; ctx.font = "16px sans-serif"; ctx.textAlign = "left"; ctx.textBaseline = "bottom"; ctx.fillText("✏️", px + it.x - 2, py + 4); }
        left -= st.pts.length + 8;
      }
    }
    ctx.restore();
  }
  cv.addEventListener("pointerdown", e => { if (SES.answered) return; e.preventDefault(); cv.setPointerCapture(e.pointerId); demo = null; cur = [toG(e)]; kid.push(cur); draw(); });
  cv.addEventListener("pointermove", e => {
    if (!cur) return;
    const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
    for (const ev of evs) { const p = toG(ev), l = cur[cur.length - 1]; if (Math.hypot(p[0] - l[0], p[1] - l[1]) > 0.7) cur.push(p); }
    draw();
  });
  const up = () => { cur = null; };
  cv.addEventListener("pointerup", up); cv.addEventListener("pointercancel", up);
  requestAnimationFrame(size);
  return {
    clear() { kid.length = 0; draw(); $("#tstars").textContent = ""; },
    demo() {
      const total = lay.items.reduce((a, it) => a + it.g.strokes.reduce((b, st) => b + st.pts.length + 8, 0), 0), t0 = performance.now();
      const step = now => { if (!demo) return; demo.p = ((now - t0) / 1000) * 45; draw(); if (demo.p < total) requestAnimationFrame(step); else setTimeout(() => { demo = null; draw(); }, 600); };
      demo = { p: 0 }; requestAnimationFrame(step); say(t.say || t.q);
    },
    showSolution() { sol = true; draw(); },
    resize: size,
    check() {
      if (!kid.length) return toast(trace ? "Fahr mit dem Finger über die graue Linie. ☝️" : "Schreib mit dem Finger in das Feld. ☝️");
      if (trace) {
        const r = traceScore(lay, kid), q = Math.min(r.cov, r.prec);
        if (r.cov >= 0.72 && r.prec >= 0.68) {
          const st = q >= 0.9 ? 3 : q >= 0.8 ? 2 : 1;
          $("#tstars").innerHTML = starsHtml(st);
          finish(true);
        } else {
          const why = r.cov < 0.72 ? "Fahr die ganze Linie nach – es fehlt noch ein Stück." : "Bleib mehr auf der grauen Linie.";
          kid.length = 0; draw(); wrong(why);
        }
      } else {
        const len = kid.reduce((a, st) => a + st.length, 0);
        if (len < 6) return toast("Schreib ein bisschen größer. ✍️");
        const res = recognize(kid, t.set);
        const ok = res[0].ch === t.g || (res[1] && res[1].ch === t.g && res[1].d <= res[0].d * 1.15);
        if (ok) finish(true);
        else { kid.length = 0; draw(); wrong(`Hmm, das sieht eher aus wie „${res[0].ch}“. Versuch es nochmal!`); }
      }
    }
  };
}

/* ======================= KLICKS ======================= */
document.addEventListener("click", e => {
  const el = e.target.closest("button, [data-act]");
  if (!el) return;
  const ds = el.dataset;
  if (ds.opt !== undefined && SES) return choose(Number(ds.opt), el);
  if (ds.k !== undefined && SES) return numKey(ds.k);
  if (VIEW.v === "paint" && !SES && paintClick(ds, el, ds.act)) return;
  if (ds.unit) return startUnit(ds.unit);
  if (ds.area) return go({ v: "area", a: ds.area });
  if (ds.go) return go({ v: ds.go });
  if (ds.prof) { G.cur = ds.prof; save(); STACK.length = 0; VIEW = { v: "home" }; return render(); }
  if (ds.clsView) { VIEW.cls = Number(ds.clsView); return renderArea(); }
  if (ds.cls) { FORM.cls = Number(ds.cls); document.querySelectorAll("#fCls button").forEach(b => b.setAttribute("aria-pressed", b === el)); return; }
  if (ds.av) { FORM.av = ds.av; document.querySelectorAll("#fAv button").forEach(b => b.setAttribute("aria-pressed", b === el)); return; }
  if (ds.toggle) { G.set[ds.toggle] = !G.set[ds.toggle]; save(); el.setAttribute("aria-pressed", G.set[ds.toggle]); return; }
  if (ds.rate) { G.set.rate = Number(ds.rate); save(); renderSet(); say("So schnell spreche ich jetzt."); return; }
  if (ds.goal) { G.set.goal = Number(ds.goal); save(); return renderSet(); }
  switch (ds.act) {
    case "back": return back();
    case "who": G.cur = null; save(); STACK.length = 0; VIEW = { v: "home" }; return render();
    case "new-prof": FORM = null; return go({ v: "edit", id: null });
    case "edit-prof": FORM = null; return go({ v: "edit", id: G.cur });
    case "save-prof": {
      const name = FORM.name.trim();
      if (!name) { toast("Bitte gib einen Namen ein."); return $("#fName").focus(); }
      let p = FORM.id !== "new" && G.profiles.find(x => x.id === FORM.id);
      if (p) Object.assign(p, { name, cls: FORM.cls, av: FORM.av });
      else { p = { id: "k" + Date.now().toString(36), name, cls: FORM.cls, av: FORM.av }; G.profiles.push(p); }
      G.cur = p.id; save(); FORM = null; STACK.length = 0; VIEW = { v: "home" }; render(); scrollTo(0, 0);
      return say(`Hallo ${name}! Los geht's!`);
    }
    case "del-prof": {
      const p = G.profiles.find(x => x.id === FORM.id);
      if (!p) return;
      ask(`Profil von <b>${esc(p.name)}</b> mit allem Fortschritt löschen?`, "Löschen", "Nein", "🗑️").then(ok => {
        if (!ok) return;
        G.profiles = G.profiles.filter(x => x !== p); delete G.data[p.id];
        try { localStorage.removeItem("lernapp_bilder_" + p.id); } catch (e2) {}
        G.cur = null; save(); FORM = null; STACK.length = 0; VIEW = { v: "home" }; render();
      });
      return;
    }
    case "rev-start": return startReview();
    case "test-voice": return say(`Hallo ${P() ? P().name : ""}! Ich bin Lumi, die Lern-Eule.`);
    case "backup": return backup();
    case "restore": return $("#restoreFile").click();
    case "share-app": return shareApp();
  }
  if (!SES) return;
  const t = curT();
  switch (ds.act) {
    case "quit": return back();
    case "say": return say(t.say || t.q);
    case "say-slow": return say(t.say || t.q, 0.65);
    case "next": return nextTask();
    case "mic-num": return micNum(el);
    case "mic-speak": return micSpeak(el);
    case "tap-instead": return tapInstead();
    case "demo": return PADS && PADS.demo();
    case "pad-clear": return PADS && PADS.clear();
    case "pad-check": return SES.answered ? nextTask() : PADS && PADS.check();
    case "type-check": return checkType();
    case "again": { const uid = SES.uid; SES = null; return startUnit(uid); }
    case "ses-done": return back();
  }
});
let RZ = 0;
addEventListener("resize", () => { clearTimeout(RZ); RZ = setTimeout(() => { if (PADS && SES) PADS.resize(); if (PAINT && VIEW.v === "paint" && !SES && document.contains(PAINT.cv)) PAINT.resize(); }, 150); });

/* ======================= START ======================= */
initDict();
if (G.cur && !P()) G.cur = null;
render();

</script>
